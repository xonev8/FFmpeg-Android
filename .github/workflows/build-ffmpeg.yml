name: Build FFmpeg 8.1 Static Android (HE-AAC v2)

on:
  workflow_dispatch:

jobs:
  build-ffmpeg-android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: aarch64
            cpu: armv8-a
            host: aarch64-linux-android
            clang_target: aarch64-linux-android28
            vpx_target: arm64-android-gcc
            x264_asm: ""
          - abi: armeabi-v7a
            arch: arm
            cpu: armv7-a
            host: armv7a-linux-androideabi
            clang_target: armv7a-linux-androideabi28
            vpx_target: armv7-android-gcc
            x264_asm: "--disable-asm"

    steps:
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake git libtool pkg-config texinfo wget yasm nasm ninja-build

      - name: Localizar Android NDK pré-instalado
        run: |
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "PREFIX=$PWD/build_${{ matrix.abi }}" >> $GITHUB_ENV

      - name: Compilar libfdk-aac, libopus e libmp3lame
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang
          export CXX=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          GH="https://github.com"

          rm -rf fdk-aac opus lame
          git clone --depth 1 "$GH/mstorsjo/fdk-aac.git"
          cd fdk-aac && autoreconf -fiv
          ./configure --prefix=$PREFIX --host=${{ matrix.host }} --enable-static --disable-shared --with-pic
          make -j$(nproc) && make install && cd ..

          git clone --depth 1 "$GH/xiph/opus.git"
          cd opus && ./autogen.sh
          ./configure --prefix=$PREFIX --host=${{ matrix.host }} --enable-static --disable-shared --disable-doc --disable-extra-programs
          make -j$(nproc) && make install && cd ..

          git clone --depth 1 "$GH/lameproject/lame.git"
          cd lame
          ./configure --prefix=$PREFIX --host=${{ matrix.host }} --enable-static --disable-shared --disable-frontend
          make -j$(nproc) && make install && cd ..

      - name: Compilar libx264 e libvpx (VP9)
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export PATH="$TOOLCHAIN/bin:$PATH"
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang
          export CXX=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang++
          export AS=$CC
          export LD=$CC
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export STRINGS=$TOOLCHAIN/bin/llvm-strings
          export NM=$TOOLCHAIN/bin/llvm-nm
          GH="https://github.com"

          rm -rf x264 libvpx
          git clone --depth 1 "$GH/mirror/x264.git"
          cd x264
          ./configure \
            --prefix=$PREFIX \
            --host=${{ matrix.host }} \
            --sysroot=$TOOLCHAIN/sysroot \
            --enable-static \
            --enable-pic \
            --disable-cli \
            ${{ matrix.x264_asm }}
          make -j$(nproc) && make install && cd ..

          git clone --depth 1 "$GH/webmproject/libvpx.git"
          cd libvpx
          ./configure \
            --prefix=$PREFIX \
            --target=${{ matrix.vpx_target }} \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp8 \
            --enable-vp9 \
            --enable-pic
          make -j$(nproc) && make install && cd ..

      - name: Compilar FFmpeg 8.1 Estático com libfdk-aac
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          GH="https://github.com"

          rm -rf ffmpeg_src
          git clone --depth 1 --branch n8.1 "$GH/FFmpeg/FFmpeg.git" ffmpeg_src
          cd ffmpeg_src
          ./configure \
            --prefix=$PREFIX \
            --target-os=android \
            --arch=${{ matrix.arch }} \
            --cpu=${{ matrix.cpu }} \
            --cc=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang \
            --cxx=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang++ \
            --ar=$TOOLCHAIN/bin/llvm-ar \
            --ranlib=$TOOLCHAIN/bin/llvm-ranlib \
            --strip=$TOOLCHAIN/bin/llvm-strip \
            --nm=$TOOLCHAIN/bin/llvm-nm \
            --enable-cross-compile \
            --sysroot=$TOOLCHAIN/sysroot \
            --extra-cflags="-O3 -flto -I$PREFIX/include -fPIE" \
            --extra-ldflags="-O3 -flto -L$PREFIX/lib -pie" \
            --pkg-config-flags="--static" \
            --enable-gpl \
            --enable-nonfree \
            --enable-static \
            --disable-shared \
            --disable-doc \
            --disable-debug \
            --enable-libfdk-aac \
            --enable-libx264 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libmp3lame

          make -j$(nproc)
          make install
          $TOOLCHAIN/bin/llvm-strip $PREFIX/bin/ffmpeg
          $TOOLCHAIN/bin/llvm-strip $PREFIX/bin/ffprobe
          cp $PREFIX/bin/ffmpeg $PREFIX/bin/libffmpeg_bin.so
          cp $PREFIX/bin/ffprobe $PREFIX/bin/libffprobe_bin.so

      - name: Disponibilizar Binários Prontos (${{ matrix.abi }})
        uses: actions/upload-artifact@v5
        with:
          name: FFmpeg-8.1-Android-${{ matrix.abi }}-HEAAC
          path: |
            build_${{ matrix.abi }}/bin/libffmpeg_bin.so
            build_${{ matrix.abi }}/bin/libffprobe_bin.so
            
      - name: Empacotar ZIP para Release (${{ matrix.abi }})
        run: |
          mkdir -p dist
          cp build_${{ matrix.abi }}/bin/ffmpeg dist/ffmpeg
          cp build_${{ matrix.abi }}/bin/ffprobe dist/ffprobe
          cp build_${{ matrix.abi }}/bin/libffmpeg_bin.so dist/libffmpeg_bin.so
          cp build_${{ matrix.abi }}/bin/libffprobe_bin.so dist/libffprobe_bin.so
          cd dist && zip -r ../FFmpeg-8.1-Android-${{ matrix.abi }}-HEAAC.zip .

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.1-android-heaac
          name: FFmpeg 8.1 Static Android (HE-AAC v2 / x264 / VP9 / Opus)
          body: |
            Binários estáticos do FFmpeg 8.1 e FFprobe 8.1 compilados para Android (`arm64-v8a` e `armeabi-v7a`) com NDK moderno e suporte completo a:
            - **libfdk-aac** (`aac_he_v2` / `aac_he` / `aac_lc`)
            - **libx264** (com NEON ativado no `arm64-v8a`)
            - **libvpx** (VP8 e VP9)
            - **libopus** e **libmp3lame**
          files: FFmpeg-8.1-Android-${{ matrix.abi }}-HEAAC.zip
