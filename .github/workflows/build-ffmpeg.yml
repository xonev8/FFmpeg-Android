name: Build FFmpeg 8.1 Android JNI + Hardware (HE-AAC v2 / MediaCodec)

on:
  workflow_dispatch:

jobs:
  build-ffmpeg-android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: aarch64
            cpu: armv8-a
            host: aarch64-linux-android
            clang_target: aarch64-linux-android28
            vpx_target: arm64-android-gcc
            x264_asm: ""
          - abi: armeabi-v7a
            arch: arm
            cpu: armv7-a
            host: armv7a-linux-androideabi
            clang_target: armv7a-linux-androideabi28
            vpx_target: armv7-android-gcc
            x264_asm: "--disable-asm"

    steps:
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake git libtool pkg-config texinfo wget yasm nasm ninja-build

      - name: Localizar Android NDK pré-instalado
        run: |
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "PREFIX=$PWD/build_${{ matrix.abi }}" >> $GITHUB_ENV

      - name: Compilar libfdk-aac, libopus e libmp3lame
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang
          export CXX=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          GH="https://github.com"

          rm -rf fdk-aac opus lame
          git clone --depth 1 "$GH/mstorsjo/fdk-aac.git"
          cd fdk-aac && autoreconf -fiv
          ./configure --prefix=$PREFIX --host=${{ matrix.host }} --enable-static --disable-shared --with-pic
          make -j$(nproc) && make install && cd ..

          git clone --depth 1 "$GH/xiph/opus.git"
          cd opus && ./autogen.sh
          ./configure --prefix=$PREFIX --host=${{ matrix.host }} --enable-static --disable-shared --disable-doc --disable-extra-programs
          make -j$(nproc) && make install && cd ..

          git clone --depth 1 "$GH/lameproject/lame.git"
          cd lame
          ./configure --prefix=$PREFIX --host=${{ matrix.host }} --enable-static --disable-shared --disable-frontend --with-pic
          make -j$(nproc) && make install && cd ..

      - name: Compilar libx264 e libvpx
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export PATH="$TOOLCHAIN/bin:$PATH"
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang
          export CXX=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang++
          export AS=$CC
          export LD=$CC
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export STRINGS=$TOOLCHAIN/bin/llvm-strings
          export NM=$TOOLCHAIN/bin/llvm-nm
          GH="https://github.com"

          rm -rf x264 libvpx
          git clone --depth 1 "$GH/mirror/x264.git"
          cd x264
          ./configure \
            --prefix=$PREFIX \
            --host=${{ matrix.host }} \
            --sysroot=$TOOLCHAIN/sysroot \
            --enable-static \
            --enable-pic \
            --disable-cli \
            ${{ matrix.x264_asm }}
          make -j$(nproc) && make install && cd ..

          git clone --depth 1 "$GH/webmproject/libvpx.git"
          cd libvpx
          ./configure \
            --prefix=$PREFIX \
            --target=${{ matrix.vpx_target }} \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --enable-vp8 \
            --enable-vp9 \
            --enable-pic
          make -j$(nproc) && make install && cd ..

      - name: Compilar FFmpeg 8.1 Estático com JNI e MediaCodec
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          GH="https://github.com"

          rm -rf ffmpeg_src
          git clone --depth 1 --branch n8.1 "$GH/FFmpeg/FFmpeg.git" ffmpeg_src
          cd ffmpeg_src
          ./configure \
            --prefix=$PREFIX \
            --target-os=android \
            --arch=${{ matrix.arch }} \
            --cpu=${{ matrix.cpu }} \
            --cc=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang \
            --cxx=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang++ \
            --ar=$TOOLCHAIN/bin/llvm-ar \
            --ranlib=$TOOLCHAIN/bin/llvm-ranlib \
            --strip=$TOOLCHAIN/bin/llvm-strip \
            --nm=$TOOLCHAIN/bin/llvm-nm \
            --enable-cross-compile \
            --sysroot=$TOOLCHAIN/sysroot \
            --extra-cflags="-O3 -I$PREFIX/include -fPIC" \
            --extra-ldflags="-O3 -L$PREFIX/lib" \
            --pkg-config-flags="--static" \
            --enable-gpl \
            --enable-nonfree \
            --enable-version3 \
            --enable-static \
            --disable-shared \
            --enable-pic \
            --disable-ffmpeg \
            --disable-ffplay \
            --disable-doc \
            --disable-debug \
            --enable-jni \
            --enable-mediacodec \
            --enable-libfdk-aac \
            --enable-libx264 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libmp3lame

          make -j$(nproc)
          make install
          $TOOLCHAIN/bin/llvm-strip $PREFIX/bin/ffprobe
          cp $PREFIX/bin/ffprobe $PREFIX/bin/libffprobe_bin.so

      - name: Criar Wrapper JNI (JavaVM) e Compilar libffmpeg_jni.so
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${{ matrix.clang_target }}-clang
          cd ffmpeg_src

          # Renomeia main() e redireciona exit() do ffmpeg para retornar ao Python sem fechar o app
          sed -i 's/int main(int argc, char \*\*argv)/int ffmpeg_main(int argc, char **argv)/g' fftools/ffmpeg.c
          sed -i 's/exit_program(int ret)/exit_program_orig(int ret)/g' fftools/cmdutils.c
          sed -i 's/void exit_program(int ret)/void exit_program_orig(int ret)/g' fftools/cmdutils.h

          cat << 'EOF' > fftools/ffmpeg_jni.c
          #include <jni.h>
          #include <stdlib.h>
          #include <setjmp.h>
          #include <libavcodec/jni.h>
          #include <libavformat/avio.h>

          int ffmpeg_main(int argc, char **argv);
          static jmp_buf jmp_exit;
          static int last_exit_code = 0;
          static volatile int cancel_flag = 0;

          void exit_program(int ret) {
              last_exit_code = ret;
              longjmp(jmp_exit, 1);
          }

          static int decode_interrupt_cb(void *ctx) {
              return cancel_flag;
          }

          JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM *vm, void *reserved) {
              av_jni_set_java_vm(vm, NULL);
              return JNI_VERSION_1_6;
          }

          void cancel_ffmpeg(void) {
              cancel_flag = 1;
          }

          int run_ffmpeg(int argc, char **argv) {
              cancel_flag = 0;
              last_exit_code = 0;
              if (setjmp(jmp_exit) == 0) {
                  last_exit_code = ffmpeg_main(argc, argv);
              }
              return last_exit_code;
          }
          EOF

          make fftools/resources/graph.css.o fftools/resources/graph.html.o || true
          rm -f fftools/ffplay*.c fftools/ffprobe*.c
          FFMPEG_SRCS=$(find fftools -name "*.c")
          FFMPEG_RES=$(find fftools/resources -name "*.o" 2>/dev/null || true)

          $CC -shared -fPIC -O3 -Wl,-Bsymbolic \
            -I. -I$PREFIX/include \
            $FFMPEG_SRCS $FFMPEG_RES \
            -L$PREFIX/lib \
            -lavdevice -lavfilter -lavformat -lavcodec -lswresample -lswscale -lavutil \
            -lfdk-aac -lx264 -lvpx -lopus -lmp3lame \
            -landroid -lmediandk -llog -lz -lm -lc -ldl \
            -o $PREFIX/bin/libffmpeg_jni.so

          $TOOLCHAIN/bin/llvm-strip $PREFIX/bin/libffmpeg_jni.so

      - name: Disponibilizar Binários Prontos (${{ matrix.abi }})
        uses: actions/upload-artifact@v5
        with:
          name: FFmpeg-8.1-Android-${{ matrix.abi }}-JNI
          path: |
            build_${{ matrix.abi }}/bin/libffmpeg_jni.so
            build_${{ matrix.abi }}/bin/libffprobe_bin.so

      - name: Empacotar ZIP para Release (${{ matrix.abi }})
        run: |
          mkdir -p dist
          cp build_${{ matrix.abi }}/bin/libffmpeg_jni.so dist/libffmpeg_jni.so
          cp build_${{ matrix.abi }}/bin/libffprobe_bin.so dist/libffprobe_bin.so
          cd dist && zip -r ../FFmpeg-8.1-Android-${{ matrix.abi }}-JNI.zip libffmpeg_jni.so libffprobe_bin.so

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v8.1-android-jni
          name: FFmpeg 8.1 Android JNI + Hardware (HE-AAC v2 / MediaCodec)
          body: |
            Biblioteca nativa `libffmpeg_jni.so` (com `JavaVM` e aceleração de hardware `MediaCodec` ativados) e `libffprobe_bin.so` compilados para Android (`arm64-v8a` e `armeabi-v7a`) com:
            - **Hardware:** `h264_mediacodec`, `hevc_mediacodec` e decodificação via GPU/VPU
            - **Áudio:** `libfdk-aac` (`aac_he_v2`), `libopus` e `libmp3lame`
            - **Vídeo:** `libx264` e `libvpx` (VP8 / VP9)
          files: FFmpeg-8.1-Android-${{ matrix.abi }}-JNI.zip
